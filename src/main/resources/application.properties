spring.application.name=SpringBootGrupal

spring.datasource.url=jdbc:postgresql://localhost:5432/facturacion
spring.datasource.username=postgres
spring.datasource.password=admin

server.error.include-message=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Integración con ARCA
arca.cuit=${ARCA_CUIT:0}
arca.clave-privada=${ARCA_CLAVE_PRIVADA:}
arca.certificado=${ARCA_CERTIFICADO:}

arca.ejecutar=false